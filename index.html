<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD74 Lunch Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0d0d0f;--soft:#5b5d64;--faint:#9a9ca3;
    --paper:#fff;--seam:#f4f4f4;--line:#e6e6e6;--red:#d81324;
    --display:'Anton','Arial Narrow',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--paper);
    color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:var(--seam)}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  button:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  .page{display:flex;flex-direction:column;height:100%;opacity:0;animation:fade .4s var(--ease) forwards}
  @keyframes fade{to{opacity:1}}

  /* ---- One compact bar: title, week nav, status ---- */
  .bar{flex-shrink:0;background:var(--ink);color:#fff;border-bottom:4px solid var(--red)}
  .bar-in{max-width:1100px;margin:0 auto;width:100%;padding:12px 16px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .title{font-family:var(--display);font-weight:400;font-size:21px;margin:0;letter-spacing:.4px;
    line-height:1;white-space:nowrap}
  .title span{color:var(--red)}

  .week{display:flex;align-items:center;gap:8px;margin-left:auto}
  .week button{border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;
    width:32px;height:32px;border-radius:50%;font-size:17px;line-height:1;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
  .week button:hover{background:var(--red)}
  .week button:active{transform:scale(.88)}
  .week .label{min-width:150px;text-align:center;font-size:13px;font-weight:600;white-space:nowrap}
  .week .today{width:auto;height:auto;border-radius:999px;padding:7px 13px;font-size:12px;
    font-weight:600;background:rgba(255,255,255,.1)}

  .status{font-size:10px;color:#9a9ca3;width:100%;margin:0}

  /* ---- Meal switch only appears when there's a choice ---- */
  .meals{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px}
  .meals button{border:none;background:transparent;color:#c9cbd2;cursor:pointer;font-size:13px;
    font-weight:600;padding:6px 14px;border-radius:6px;transition:background .18s,color .18s}
  .meals button.on{background:var(--red);color:#fff}

  /* ---- Headline: what's for lunch today ---- */
  .banner{flex-shrink:0;background:var(--seam);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;
    justify-content:center;text-align:center;
    opacity:0;animation:fade .4s var(--ease) .15s forwards}
  .banner .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
    color:var(--red);flex-shrink:0}
  .banner .bn{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.3px;
    line-height:1.15}
  .banner .bs{font-size:12.5px;color:var(--soft);flex-basis:100%}

  main{flex:1;min-height:0;overflow-y:auto}
  .wrap{max-width:1100px;margin:0 auto;width:100%;padding:18px 16px 44px}

  /* ---- Five day columns, one per school day ---- */
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}

  .day{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);
    display:flex;flex-direction:column;opacity:0;transform:translateY(8px);
    animation:in .3s var(--ease) forwards;transition:box-shadow .2s,transform .2s}
  @keyframes in{to{opacity:1;transform:none}}
  .day:hover{box-shadow:0 8px 22px rgba(0,0,0,.08);transform:translateY(-2px)}
  .day.today{border-color:var(--red);box-shadow:0 0 0 2px rgba(216,19,36,.15)}
  .day.off{background:var(--seam)}

  .day h2{margin:0;padding:11px 13px 10px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .day h2 .dow{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.5px}
  .day h2 .dt{font-size:11px;font-weight:600;color:var(--faint)}
  .day.today h2{background:var(--red);border-bottom-color:var(--red)}
  .day.today h2 .dow,.day.today h2 .dt{color:#fff}

  .body{padding:12px 13px 14px;flex:1;display:flex;flex-direction:column;gap:9px}

  /* The entrée is the thing people actually want to see. */
  .main-item{font-size:15.5px;font-weight:700;line-height:1.3}
  .rest{display:flex;flex-direction:column;gap:5px}
  .rest span{font-size:13px;color:var(--soft);line-height:1.35}
  .off-note{font-size:13px;color:var(--faint);padding:2px 0}

  .empty{padding:60px 20px;text-align:center;color:var(--soft);font-size:14px;line-height:1.6}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}
  .retry{margin-top:14px;background:var(--ink);color:#fff;border:none;padding:9px 18px;
    border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
  .retry:hover{background:var(--red)}

  .note{max-width:1100px;margin:20px auto 0;padding:0 16px;text-align:center;
    font-size:11px;color:var(--faint);line-height:1.6}

  @media (max-width:640px){
    .bar-in{padding:10px 12px;gap:10px}
    .title{font-size:18px}
    .week{width:100%;margin-left:0;justify-content:space-between}
    .week .label{min-width:0;flex:1}
    .days{grid-template-columns:1fr}
    .banner{padding:10px 12px}
    .banner .bn{font-size:21px}
    .day:hover{transform:none;box-shadow:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .page,.day{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <div class="bar-in">
      <h1 class="title">SD74 <span>Lunch</span></h1>
      <div class="meals" id="meals" role="tablist" aria-label="Meal"></div>
      <div class="week">
        <button id="prev" aria-label="Previous week">‹</button>
        <span class="label" id="weekLabel">Loading…</span>
        <button id="next" aria-label="Next week">›</button>
        <button class="today" id="today">Today</button>
      </div>
      <p class="status" id="status">&nbsp;</p>
    </div>
  </header>

  <section class="banner" id="banner"></section>

  <main><div class="wrap">
    <div class="days" id="days"></div>
    <p class="note" id="note"></p>
  </div></main>
</div>

  let DATA = {}, school = null, meal = null, monday = null;

  const $ = id => document.getElementById(id);
  const daysEl=$('days'), statusEl=$('status'), weekLabel=$('weekLabel'),
        mealsEl=$('meals'), noteEl=$('note'), banner=$('banner');

  const pad = n => n<10?'0'+n:''+n;
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const TODAY = key(new Date());

  function mondayOf(d){
    const x=new Date(d); x.setHours(0,0,0,0);
    x.setDate(x.getDate()-((x.getDay()+6)%7));   // Mon = 0
    return x;
  }

  // On a Saturday or Sunday the "current" week has already finished, so
  // roll forward to the upcoming school week rather than showing the one
  // that just ended.
  function schoolWeekMonday(now){
    const m = mondayOf(now), dow = now.getDay();   // 0 = Sun, 6 = Sat
    return (dow === 0 || dow === 6) ? addDays(m, 7) : m;
  }
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const fmt = (d,o) => d.toLocaleDateString('en-US',o);

  function schoolDays(){ return (DATA.schools && DATA.schools[school]) || {}; }

  function allMeals(){
    const set=new Set();
    Object.values(schoolDays()).forEach(m=>Object.keys(m).forEach(x=>set.add(x)));
    return [...set].sort((a,b)=>a==='Lunch'?-1:b==='Lunch'?1:a.localeCompare(b));
  }

  function itemsFor(k){
    const d = schoolDays()[k];
    return (d && d[meal]) || [];
  }

  // The headline item is the entrée. Category names vary between districts
  // ("Entree", "Entrees", "Main Dish"), and some feeds omit them entirely,
  // so fall back to the first item, which the fetcher already sorts with
  // entrées first.
  const ENTREE_RE = /entr[ée]e|main|hot\s*food|featured/i;
  function split(items){
    if(!items.length) return [null, []];
    const i = items.findIndex(x => ENTREE_RE.test(x.type||''));
    if(i >= 0) return [items[i], items.filter((_,j)=>j!==i)];
    return [items[0], items.slice(1)];
  }

  // The entrée for a given date, used by the banner.
  function entreeOn(k){
    const [head] = split(itemsFor(k));
    return head ? head.name : null;
  }

  // What to headline at the top of the page: today's lunch if school is in
  // session and a menu exists, otherwise the next day that has one.
  function headline(){
    if(entreeOn(TODAY)) return {when:'today', k:TODAY, name:entreeOn(TODAY)};
    const upcoming = Object.keys(schoolDays())
      .filter(k => k > TODAY && itemsFor(k).length).sort()[0];
    if(upcoming) return {when:'next', k:upcoming, name:entreeOn(upcoming)};
    return null;
  }

  function renderBanner(){
    const h = headline();
    if(!h){ banner.style.display='none'; return; }
    banner.style.display='';
    banner.innerHTML='';

    const lab=document.createElement('span'); lab.className='bl';
    const d=new Date(h.k.split('-')[0], h.k.split('-')[1]-1, h.k.split('-')[2]);
    lab.textContent = h.when==='today'
      ? `Today's ${meal||'Lunch'}`
      : `${fmt(d,{weekday:'long'})}'s ${meal||'Lunch'}`;

    const nm=document.createElement('span'); nm.className='bn'; nm.textContent=h.name;

    const rest = itemsFor(h.k).filter(x => x.name !== h.name);
    banner.append(lab, nm);
    if(rest.length){
      const sub=document.createElement('span'); sub.className='bs';
      sub.textContent = 'with ' + rest.map(x=>x.name).join(', ');
      banner.appendChild(sub);
    }
  }

  function renderMeals(){
    const ms = allMeals();
    mealsEl.innerHTML='';
    mealsEl.style.display = ms.length>1 ? '' : 'none';
    ms.forEach(x=>{
      const b=document.createElement('button');
      b.textContent=x; if(x===meal) b.className='on';
      b.setAttribute('role','tab'); b.setAttribute('aria-selected',String(x===meal));
      b.addEventListener('click',()=>{ meal=x; render(); });
      mealsEl.appendChild(b);
    });
  }

  function render(){
    renderMeals();
    renderBanner();
    const mon = monday || schoolWeekMonday(new Date());
    const fri = addDays(mon,4);
    weekLabel.textContent =
      `${fmt(mon,{month:'short',day:'numeric'})} – ${fmt(fri,{month:'short',day:'numeric'})}`;

    daysEl.innerHTML='';
    const posted = Object.keys(schoolDays()).length;
    if(!posted){ daysEl.appendChild(emptyState()); noteEl.textContent=''; return; }

    let shown = 0;
    for(let i=0;i<5;i++){
      const d = addDays(mon,i), k = key(d), items = itemsFor(k);
      if(items.length) shown++;

      const card=document.createElement('div');
      card.className='day'+(k===TODAY?' today':'')+(items.length?'':' off');
      card.style.animationDelay=`${i*45}ms`;

      const h=document.createElement('h2');
      const dow=document.createElement('span'); dow.className='dow';
      dow.textContent=fmt(d,{weekday:'long'});
      const dt=document.createElement('span'); dt.className='dt';
      dt.textContent = k===TODAY ? 'TODAY' : fmt(d,{month:'short',day:'numeric'}).toUpperCase();
      h.append(dow,dt); card.appendChild(h);

      const body=document.createElement('div'); body.className='body';
      if(!items.length){
        const n=document.createElement('div'); n.className='off-note';
        n.textContent='No menu posted';
        body.appendChild(n);
      }else{
        const [head, rest] = split(items);
        const hEl=document.createElement('div'); hEl.className='main-item';
        hEl.textContent = head ? head.name : '';
        body.appendChild(hEl);
        if(rest.length){
          const r=document.createElement('div'); r.className='rest';
          rest.forEach(it=>{ const s=document.createElement('span'); s.textContent=it.name; r.appendChild(s); });
          body.appendChild(r);
        }
      }
      card.appendChild(body);
      daysEl.appendChild(card);
    }

    noteEl.textContent = shown
      ? 'Menus can change due to product availability. Source: MealViewer.'
      : 'Nothing posted for this week — try the arrows to browse other weeks.';
  }

  function emptyState(){
    const d=document.createElement('div'); d.className='empty';
    const b=document.createElement('b'); b.textContent='Menu unavailable'; d.appendChild(b);
    d.appendChild(document.createTextNode(
      "Couldn't load the menu right now. It refreshes automatically each day."));
    const r=document.createElement('button'); r.className='retry'; r.textContent='Try again';
    r.addEventListener('click',load);
    d.appendChild(document.createElement('br')); d.appendChild(r);
    return d;
  }

  $('prev').addEventListener('click',()=>{ monday=addDays(monday||schoolWeekMonday(new Date()),-7); render(); });
  $('next').addEventListener('click',()=>{ monday=addDays(monday||schoolWeekMonday(new Date()), 7); render(); });
  $('today').addEventListener('click',()=>{ monday=schoolWeekMonday(new Date()); render(); });

  function fmtWhen(iso){
    try{ return new Date(iso).toLocaleString('en-US',
      {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
    catch(e){ return null; }
  }

  function adopt(payload){
    DATA=payload;
    school = Object.keys(DATA.schools||{})[0] || null;
    const ms = allMeals(); if(!ms.includes(meal)) meal = ms[0] || null;

    // Open on this week, but if nothing's posted for it, jump to the
    // nearest week that does have a menu rather than showing blanks.
    monday = schoolWeekMonday(new Date());
    const has = w => { for(let i=0;i<5;i++) if(itemsFor(key(addDays(w,i))).length) return true; return false; };
    if(!has(monday)){
      const keys=Object.keys(schoolDays()).filter(k=>itemsFor(k).length).sort();
      const nextK = keys.find(k=>k>=TODAY) || keys[keys.length-1];
      if(nextK){ const [y,m,d]=nextK.split('-').map(Number); monday=mondayOf(new Date(y,m-1,d)); }
    }
    render();
  }

  async function load(){
    statusEl.textContent='Loading…';
    try{
      const res=await fetch(MENU_URL,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(!data||!data.schools||!Object.keys(data.schools).length) throw new Error('no menu data');
      const when=fmtWhen(data.generated_at);
      statusEl.textContent = when ? `Updated ${when}` : 'Live menu';
      adopt(data);
    }catch(err){
      console.warn('Live menu unavailable, using saved copy:',err);
      const n = FALLBACK.schools && Object.keys(FALLBACK.schools).length;
      statusEl.textContent = n ? 'Saved menu' : 'Menu unavailable';
      statusEl.title = 'Could not load live menu ('+((err&&err.message)||err)+').';
      adopt(FALLBACK);
    }
  }

  load();
});
</script>
