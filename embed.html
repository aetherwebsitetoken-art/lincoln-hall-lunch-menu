<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD74 Lunch Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --font:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --bg:#07070c; --ink:#fff; --soft:rgba(255,255,255,.76); --faint:rgba(255,255,255,.52);
    --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.10); --line:rgba(255,255,255,.12);
    --red:#ff4d5e; --red-deep:#e11d2e; --base:#0b060a;
    --ease:cubic-bezier(.22,.8,.26,1);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit}
  button,.cell,.day{-webkit-tap-highlight-color:transparent}
  button:focus-visible,.cell:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}

  .sky{position:fixed;inset:0;z-index:0;background:var(--base)}
  .sky::before,.sky::after{content:'';position:absolute;inset:-7%;
    background:
      radial-gradient(42% 38% at 18% 20%, rgba(255,77,94,.32), transparent 70%),
      radial-gradient(45% 40% at 84% 76%, rgba(255,255,255,.07), transparent 72%),
      radial-gradient(30% 30% at 60% 12%, rgba(225,29,46,.22), transparent 70%);
    opacity:.5;animation:drift 42s ease-in-out infinite alternate;will-change:transform}
  .sky::after{opacity:.22;animation-duration:52s;animation-direction:alternate-reverse;
    background:radial-gradient(35% 32% at 74% 16%, rgba(255,107,120,.24), transparent 70%),
               radial-gradient(40% 36% at 20% 84%, rgba(225,29,46,.2), transparent 72%)}
  @keyframes drift{0%{transform:translate3d(-1.2%,-1%,0) scale(1)}100%{transform:translate3d(1.2%,1.2%,0) scale(1.04)}}
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
  body.switching .sky::before,body.switching .sky::after{animation-play-state:paused}

  .page{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
    opacity:0;animation:fade .5s var(--ease) forwards}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- Header ---------- */
  .bar{flex-shrink:0;background:rgba(9,9,16,.62);border-bottom:1px solid var(--line);
    box-shadow:0 10px 30px -18px #000}
  .bar-in{max-width:1200px;margin:0 auto;width:100%;padding:11px 18px;
    display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .mark{width:40px;height:40px;border-radius:10px;flex-shrink:0;
    background:repeating-linear-gradient(135deg,var(--red-deep) 0 7px,#14141c 7px 14px);
    box-shadow:0 5px 14px rgba(225,29,46,.2),inset 0 0 0 1px rgba(255,255,255,.14);
    transition:transform .35s var(--ease)}
  .brand:hover .mark{transform:rotate(8deg) scale(1.06)}
  .brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
  .brand h1 span{color:var(--red)}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--faint);font-weight:500}

  .ctrls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:11px;padding:3px;gap:2px;flex-shrink:0}
  .seg button{border:none;background:transparent;color:var(--soft);cursor:pointer;font-size:13px;
    font-weight:600;padding:7px 15px;border-radius:8px;transition:background .22s,color .22s}
  .seg button.on{background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;
    box-shadow:0 5px 12px -6px rgba(225,29,46,.55)}

  .nav{display:flex;align-items:center;gap:8px}
  .nav .arw{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
    color:var(--ink);font-size:19px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;transition:background .18s,transform .18s,border-color .18s}
  .nav .arw:active{transform:scale(.9)}
  .nav .lbl{min-width:132px;text-align:center;white-space:nowrap;display:flex;flex-direction:column;line-height:1.2}
  .nav .lbl b{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
  .status{font-size:10px;color:var(--faint);font-weight:500}
  .nav .tdy{border:1px solid var(--line);background:var(--glass);color:var(--soft);cursor:pointer;
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;white-space:nowrap;
    transition:background .18s,color .18s,transform .18s}
  .nav .tdy:active{transform:scale(.94)}

  /* ---------- Today's lunch banner ---------- */
  .hero{flex-shrink:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}
  .hero-in{position:relative;max-width:1200px;margin:0 auto;padding:16px 18px 15px;
    display:flex;gap:18px;align-items:center}
  .plate{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:31px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),rgba(255,77,94,.16));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 9px 20px -14px rgba(225,29,46,.55)}
  .hero .txt{min-width:0;flex:1;padding-right:84px}
  .hero .when{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--red)}
  .hero .dish{font-size:clamp(20px,3vw,30px);font-weight:700;line-height:1.14;letter-spacing:-.6px;margin:4px 0 9px}
  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:12px;background:var(--glass);border:1px solid var(--line);color:var(--soft);
    padding:5px 12px;border-radius:999px}
  .hero .opts{font-size:11.5px;color:var(--faint);margin-top:9px}
  .tog{position:absolute;right:18px;top:14px;border:1px solid var(--line);background:var(--glass);
    color:var(--soft);font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:background .18s,color .18s,border-color .18s}
  .tog .chev{display:inline-block;transition:transform .28s var(--ease)}
  .hero.closed .tog .chev{transform:rotate(180deg)}
  .hero.closed .hero-in{padding:10px 18px}
  .hero.closed .plate,.hero.closed .tags,.hero.closed .opts{display:none}
  .hero.closed .txt{display:flex;align-items:baseline;gap:11px;min-width:0}
  .hero.closed .when{flex-shrink:0}
  .hero.closed .dish{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hero.closed .tog{top:50%;transform:translateY(-50%)}

  main{flex:1;min-height:0;overflow-y:auto}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 18px 44px}

  /* ---------- Week view ---------- */
  .week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
  .day{background:var(--glass);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;opacity:0;animation:rise .34s var(--ease) forwards;
    transition:transform .22s var(--ease),box-shadow .22s,background .22s,border-color .22s}
  .day.today{border-color:rgba(255,77,94,.7);box-shadow:0 0 0 1px rgba(255,77,94,.3),0 14px 28px -24px rgba(225,29,46,.55)}
  .day.off{opacity:.55}
  .day h2{margin:0;padding:12px 14px 11px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .day h2 .dow{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
  .day h2 .dt{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.6px}
  .day.today h2{background:linear-gradient(180deg,rgba(255,77,94,.9),rgba(225,29,46,.75));border-bottom-color:transparent}
  .day.today h2 .dow,.day.today h2 .dt{color:#fff}
  .db{padding:14px;flex:1;display:flex;flex-direction:column;gap:11px}
  .feat{font-size:15.5px;font-weight:700;line-height:1.3}
  .sect{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--faint);margin-bottom:5px}
  .sides{display:flex;flex-direction:column;gap:5px}
  .sides span{font-size:13px;color:var(--soft);line-height:1.35;padding-left:13px;position:relative}
  .sides span::before{content:'';position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;
    background:var(--red);}
  .alts{margin-top:auto;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px}
  .alts > span{display:block;font-size:12px;color:var(--soft);line-height:1.45}
  .off-note{font-size:13px;color:var(--faint)}
  .code{display:inline-block;font-size:9px;font-weight:700;color:var(--faint);
    border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px;line-height:1.5}

  /* ---------- Month view ---------- */
  .mhead{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:7px}
  .mhead div{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;
    color:var(--faint);text-align:center}
  .month{--mf:13px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .cell{background:var(--glass);border:1px solid var(--line);border-radius:14px;min-height:96px;
    padding:10px 11px;display:flex;flex-direction:column;gap:5px;cursor:pointer;
    opacity:0;animation:rise .3s var(--ease) forwards;
    transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s}
  .cell.out{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.07);
    cursor:default;opacity:.45}
  .cell.empty{background:rgba(255,255,255,.02)}
  .cell.today{border-color:rgba(255,77,94,.7);box-shadow:0 0 0 1px rgba(255,77,94,.3),
    0 12px 24px -22px rgba(225,29,46,.55)}
  .cell .n{font-size:calc(var(--mf)*.9);font-weight:700;color:var(--faint)}
  .cell.today .n{color:var(--red)}
  .cell .f{font-size:var(--mf);font-weight:700;line-height:1.22}
  .cell .s{font-size:calc(var(--mf)*.8);color:var(--faint);line-height:1.3;margin-top:auto}
  .month.compact .s{display:none}
  .month.breakwords .f,.month.breakwords .s{overflow-wrap:anywhere;hyphens:auto}

  /* Month "fit" mode: the whole month visible at once, no scrolling, so it
     can be captured in a single screenshot. */
  main.fit{overflow:hidden}
  main.fit .wrap{height:100%;display:flex;flex-direction:column;padding-bottom:14px}
  main.fit #view{flex:1;min-height:0;display:flex;flex-direction:column}
  main.fit .month{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  main.fit .cell{min-height:0;overflow:hidden;padding:calc(var(--mf)*.55) calc(var(--mf)*.62);
    gap:calc(var(--mf)*.3)}
  main.fit .note{display:none}
  main.fit.nofit{overflow-y:auto}
  main.fit.nofit .wrap{height:auto}
  main.fit.nofit .month{grid-auto-rows:auto}

  .empty-state{padding:64px 20px;text-align:center;color:var(--soft);font-size:14px;line-height:1.7}
  .empty-state b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}
  .retry{margin-top:16px;background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;
    border:none;padding:10px 20px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;
    box-shadow:0 8px 18px -10px rgba(225,29,46,.6)}
  .note{text-align:center;font-size:11.5px;color:var(--faint);margin:22px 0 0;line-height:1.6}

  @media (hover:hover){
    .day:hover{background:var(--glass-2);border-color:rgba(255,255,255,.26);transform:translateY(-3px);
      box-shadow:0 20px 40px -24px #000}
    .cell:not(.out):hover{background:var(--glass-2);border-color:rgba(255,255,255,.28);
      transform:translateY(-3px);box-shadow:0 18px 34px -22px #000}
    .tog:hover,.nav .arw:hover,.nav .tdy:hover{background:var(--glass-2);border-color:rgba(255,255,255,.3);color:#fff}
    .seg button:not(.on):hover{color:#fff;background:rgba(255,255,255,.07)}
    .retry:hover{filter:brightness(1.08)}
  }
  .cell:not(.out):active{transform:scale(.99)}

  @media (max-width:900px){ .week{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:640px){
    .bar-in{padding:9px 12px;gap:8px 10px}
    .brand p{display:none}
    .brand h1{font-size:17px}
    .mark{width:34px;height:34px}
    .ctrls{display:contents}
    .ctrls > .seg:not(#meals){order:2;margin-left:auto}
    #meals{order:4}
    .nav{order:3;width:100%}
    .nav .lbl{min-width:0;flex:1}
    .nav .arw{width:40px;height:40px;font-size:20px}
    .nav .tdy{padding:9px 13px}
    .seg button{padding:7px 12px}
    .hero-in{padding:13px 12px;gap:12px}
    .plate{width:46px;height:46px;font-size:23px}
    .hero .txt{padding-right:70px}
    .tog{right:10px;top:11px;padding:6px 10px}
    .hero.closed .hero-in{padding:9px 12px}
    .hero.closed .dish{font-size:14px}
    .week{grid-template-columns:1fr}
    .wrap{padding:12px 11px 32px}
    .month,.mhead{gap:5px}
    .mhead div{font-size:10px}
    .cell{min-height:64px;padding:7px;border-radius:11px}
    .day{border-radius:15px}
  }
  @media (max-height:500px) and (orientation:landscape){
    .bar-in{padding:6px 16px}
    .brand p{display:none}
    .mark{width:30px;height:30px}
    .hero-in{padding:9px 16px}
    .plate{width:42px;height:42px;font-size:21px}
    .hero .dish{font-size:19px;margin:2px 0 5px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important}
    .page,.day,.cell{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="page">
  <header class="bar">
    <div class="bar-in">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div><h1>SD74 <span>Lunch</span></h1><p>Lincolnwood School District 74</p></div>
      </div>
      <div class="ctrls">
        <div class="seg" id="meals" role="tablist" aria-label="Meal"></div>
        <div class="seg" role="tablist" aria-label="View">
          <button id="vWeek" class="on">Week</button>
          <button id="vMonth">Month</button>
        </div>
        <div class="nav">
          <button class="arw" id="prev" aria-label="Previous">‹</button>
          <span class="lbl"><b id="lbl">Loading…</b><small class="status" id="status">&nbsp;</small></span>
          <button class="arw" id="next" aria-label="Next">›</button>
          <button class="tdy" id="tdy">Today</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <main id="main"><div class="wrap">
    <div id="view"></div>
    <p class="note" id="note"></p>
  </div></main>
</div>

  let DATA={}, school=null, meal=null, mode='week', anchor=null, heroOpen=true;

  const $=id=>document.getElementById(id);
  const mainEl=$('main'), viewEl=$('view'), hero=$('hero'), lbl=$('lbl'), statusEl=$('status'),
        mealsEl=$('meals'), noteEl=$('note');

  // ---------- Dates ----------
  const pad=n=>n<10?'0'+n:''+n;
  const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=(d,o)=>d.toLocaleDateString('en-US',o);
  const TODAY=key(new Date());

  function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
  // Saturday/Sunday belong to the week ahead, not the one just finished.
  function schoolWeekMonday(now){
    const m=mondayOf(now),dow=now.getDay();
    return (dow===0||dow===6)?addDays(m,7):m;
  }

  // ---------- Data access ----------
  const schoolDays=()=>(DATA.schools&&DATA.schools[school])||{};
  const itemsFor=k=>{const d=schoolDays()[k];return (d&&d[meal])||[];};

  function allMeals(){
    const set=new Set();
    Object.values(schoolDays()).forEach(m=>Object.keys(m).forEach(x=>set.add(x)));
    return [...set].sort((a,b)=>a==='Lunch'?-1:b==='Lunch'?1:a.localeCompare(b));
  }

  // The fetcher marks each day's real lunch ("featured") and the daily
  // fallback choices ("alt"). Older data without those flags falls back to
  // treating the first entree-like item as the headline.
  const ENTREE_RE=/entr[ée]e|main|hot\s*food|featured/i;
  const ALT_RE=/\b(option|alternate)\b/i;
  function parts(items){
    if(!items.length) return {feat:null,sides:[],alts:[]};
    let feat=items.find(i=>i.featured);
    const isAlt=i=>i.alt!==undefined?i.alt:ALT_RE.test(i.name);
    if(!feat) feat=items.find(i=>ENTREE_RE.test(i.type||'')&&!isAlt(i))
                  ||items.find(i=>!isAlt(i))||items[0];
    return {
      feat,
      sides:items.filter(i=>i!==feat&&!isAlt(i)),
      alts:items.filter(i=>i!==feat&&isAlt(i))
    };
  }

  // Menu names often carry codes like "(K)(H)" and run words together
  // ("Beef(H)Homemade"). Split the codes out and show them as small tags
  // rather than guessing what each one stands for.
  function nameNode(name,cls){
    const el=document.createElement('span'); if(cls) el.className=cls;
    const codes=[];
    let text=(name||'').replace(/\(\s*([A-Z]{1,3})\s*\)/g,(_,c)=>{codes.push(c);return ' ';})
                       .replace(/\s+/g,' ').replace(/\s+,/g,',').trim();
    text=text.replace(/\s+Option$/i,'').trim()||name;
    el.appendChild(document.createTextNode(text));
    [...new Set(codes)].forEach(c=>{
      const t=document.createElement('span'); t.className='code'; t.textContent=c; el.appendChild(t);
    });
    return el;
  }
  const plainName=n=>(n||'').replace(/\(\s*[A-Z]{1,3}\s*\)/g,' ').replace(/\s+/g,' ').trim();

  // A little food emoji for the banner, picked from the dish name.
  function emojiFor(n){
    const s=(n||'').toLowerCase();
    const map=[[/chili|soup|stew/,'🍲'],[/pizza/,'🍕'],[/taco|burrito|nacho|quesadilla/,'🌮'],
      [/burger/,'🍔'],[/hot\s*dog/,'🌭'],[/chicken|tender|nugget|wing/,'🍗'],[/pasta|penne|spaghetti|lasagna|mac/,'🍝'],
      [/wrap|sandwich|sub|panini/,'🥪'],[/rice|teriyaki|orange chicken|fried rice/,'🍚'],[/salad/,'🥗'],
      [/pancake|waffle|french toast/,'🥞'],[/bagel|muffin|bread/,'🥯'],[/egg/,'🍳'],[/fish/,'🐟']];
    for(const [re,e] of map) if(re.test(s)) return e;
    return '🍽️';
  }

  // ---------- Header controls ----------
  function renderMeals(){
    const ms=allMeals(); mealsEl.innerHTML='';
    mealsEl.style.display=ms.length>1?'':'none';
    ms.forEach(x=>{
      const b=document.createElement('button'); b.textContent=x; if(x===meal) b.className='on';
      b.addEventListener('click',()=>{meal=x;render();}); mealsEl.appendChild(b);
    });
  }

  // ---------- Headline banner ----------
  function renderHero(){
    let k=TODAY, when="Today's lunch";
    if(!itemsFor(k).length){
      const up=Object.keys(schoolDays()).filter(x=>x>TODAY&&itemsFor(x).length).sort()[0];
      if(!up){hero.style.display='none';return;}
      k=up; when=`${fmt(fromKey(k),{weekday:'long'})}'s ${(meal||'lunch').toLowerCase()} · ${fmt(fromKey(k),{month:'short',day:'numeric'})}`;
    } else if(meal && meal!=='Lunch') when=`Today's ${meal.toLowerCase()}`;
    hero.style.display='';

    const {feat,sides,alts}=parts(itemsFor(k));
    hero.innerHTML='';
    const inn=document.createElement('div'); inn.className='hero-in';
    const plate=document.createElement('div'); plate.className='plate'; plate.textContent=emojiFor(feat&&feat.name);
    const txt=document.createElement('div'); txt.className='txt';
    const w=document.createElement('div'); w.className='when'; w.textContent=when;
    const dish=document.createElement('div'); dish.className='dish'; dish.textContent=plainName(feat&&feat.name);
    txt.append(w,dish);
    if(sides.length){
      const tags=document.createElement('div'); tags.className='tags';
      sides.forEach(s=>{const t=document.createElement('span');t.className='tag';t.textContent=plainName(s.name);tags.appendChild(t);});
      txt.appendChild(tags);
    }
    if(alts.length){
      const o=document.createElement('div'); o.className='opts';
      o.textContent='Also available: '+alts.map(a=>plainName(a.name).replace(/\s+Option$/i,'')).join(' · ');
      txt.appendChild(o);
    }
    const tog=document.createElement('button'); tog.className='tog';
    tog.setAttribute('aria-expanded',String(heroOpen));
    tog.setAttribute('aria-controls','hero');
    const lab=document.createElement('span'); lab.textContent=heroOpen?'Hide':'Show';
    const chev=document.createElement('span'); chev.className='chev'; chev.textContent='▴';
    tog.append(lab,chev);
    tog.addEventListener('click',()=>{
      heroOpen=!heroOpen;
      hero.classList.toggle('closed',!heroOpen);
      lab.textContent=heroOpen?'Hide':'Show';
      tog.setAttribute('aria-expanded',String(heroOpen));
      if(mode==='month') requestAnimationFrame(fitMonth);   // more room -> bigger text
    });
    inn.append(plate,txt,tog); hero.appendChild(inn);
    hero.classList.toggle('closed',!heroOpen);
  }

  // ---------- Week view ----------
  function renderWeek(){
    const mon=anchor;
    lbl.textContent=`${fmt(mon,{month:'short',day:'numeric'})} – ${fmt(addDays(mon,4),{month:'short',day:'numeric'})}`;
    const grid=document.createElement('div'); grid.className='week';
    let shown=0;
    for(let i=0;i<5;i++){
      const d=addDays(mon,i),k=key(d),items=itemsFor(k);
      if(items.length) shown++;
      const card=document.createElement('div');
      card.className='day'+(k===TODAY?' today':'')+(items.length?'':' off');
      card.style.animationDelay=`${i*45}ms`;
      const h=document.createElement('h2');
      const a=document.createElement('span');a.className='dow';a.textContent=fmt(d,{weekday:'long'});
      const b=document.createElement('span');b.className='dt';
      b.textContent=k===TODAY?'TODAY':fmt(d,{month:'short',day:'numeric'}).toUpperCase();
      h.append(a,b); card.appendChild(h);

      const body=document.createElement('div'); body.className='db';
      if(!items.length){
        const n=document.createElement('div');n.className='off-note';n.textContent='No menu posted';body.appendChild(n);
      }else{
        const {feat,sides,alts}=parts(items);
        body.appendChild(nameNode(feat.name,'feat'));
        if(sides.length){
          const wrap=document.createElement('div');
          const t=document.createElement('div');t.className='sect';t.textContent='Served with';
          const l=document.createElement('div');l.className='sides';
          sides.forEach(s=>l.appendChild(nameNode(s.name)));
          wrap.append(t,l); body.appendChild(wrap);
        }
        if(alts.length){
          const box=document.createElement('div');box.className='alts';
          const t=document.createElement('div');t.className='sect';t.textContent='Daily options';
          box.appendChild(t);
          alts.forEach(x=>{const s=nameNode(x.name);s.style.display='block';s.style.fontSize='12px';s.style.color='var(--soft)';box.appendChild(s);});
          body.appendChild(box);
        }
      }
      card.appendChild(body); grid.appendChild(card);
    }
    viewEl.innerHTML=''; viewEl.appendChild(grid);
    noteEl.textContent=shown?'Menus can change due to product availability. Source: MealViewer.'
                            :'Nothing posted for this week yet — use the arrows to browse, or switch to Month.';
  }

  // ---------- Month view ----------
  function renderMonth(){
    const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    const last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);
    lbl.textContent=fmt(first,{month:'long',year:'numeric'});

    const head=document.createElement('div'); head.className='mhead';
    ['Mon','Tue','Wed','Thu','Fri'].forEach(x=>{const d=document.createElement('div');d.textContent=x;head.appendChild(d);});
    const grid=document.createElement('div'); grid.className='month';

    // Start on the Monday of the week containing the 1st, finish on the
    // Friday of the week containing the last day; weekends are skipped.
    let d=mondayOf(first), n=0, shown=0;
    const end=addDays(mondayOf(last),4);
    while(d<=end){
      for(let i=0;i<5;i++){
        const day=addDays(d,i),k=key(day),inMonth=day.getMonth()===first.getMonth();
        const items=itemsFor(k);
        const c=document.createElement('div');
        c.className='cell'+(inMonth?'':' out')+(inMonth&&!items.length?' empty':'')+(k===TODAY?' today':'');
        c.style.animationDelay=`${Math.min(n,24)*14}ms`; n++;
        const num=document.createElement('div');num.className='n';num.textContent=day.getDate();
        c.appendChild(num);
        if(inMonth&&items.length){
          shown++;
          const {feat,sides}=parts(items);
          const f=document.createElement('div');f.className='f';f.textContent=plainName(feat.name);
          c.appendChild(f);
          if(sides.length){
            const s=document.createElement('div');s.className='s';
            s.textContent=sides.map(x=>plainName(x.name)).join(', ');
            c.appendChild(s);
          }
        }
        if(inMonth) c.addEventListener('click',()=>{mode='week';anchor=mondayOf(day);render();});
        grid.appendChild(c);
      }
      d=addDays(d,7);
    }
    viewEl.innerHTML=''; viewEl.append(head,grid);
    noteEl.textContent=shown?'Tap any day to see its full menu. Menus can change due to product availability.'
                            :'No menu posted for this month yet.';
    requestAnimationFrame(fitMonth);
  }

  // Size the month so the whole thing is visible at once, every lunch name
  // in full. Largest text that fits wins; if even the smallest readable size
  // doesn't fit, sides are dropped (lunch names are kept); if it still
  // doesn't fit (e.g. a phone held sideways), the month scrolls instead.
  function fitMonth(){
    const m=viewEl.querySelector('.month');
    if(mode!=='month'||!m||!m.getBoundingClientRect) return;
    mainEl.classList.add('fit'); mainEl.classList.remove('nofit');
    m.classList.remove('compact','breakwords');
    const cells=[...m.querySelectorAll('.cell')];
    const texts=[...m.querySelectorAll('.f,.s')];
    const overflowing=()=>cells.some(c=>c.scrollHeight>c.clientHeight+1)
                        || texts.some(t=>t.offsetParent && t.scrollWidth>t.clientWidth+1);
    const small=window.innerWidth<641;
    const maxF=small?12:15, minF=small?8.5:10;
    const attempt=()=>{
      for(let f=maxF; f>=minF; f-=0.5){
        m.style.setProperty('--mf',f+'px');
        if(!overflowing()) return true;
      }
      return false;
    };
    if(attempt()) return;
    m.classList.add('compact');           // 1st fallback: drop sides, keep lunches
    if(attempt()) return;
    m.classList.add('breakwords');        // 2nd: allow breaking very long words
    if(attempt()) return;
    mainEl.classList.add('nofit');        // last: let the month scroll
    m.classList.remove('compact','breakwords');
    m.style.setProperty('--mf',(small?11:13)+'px');
  }
  let fitTimer=null;
  window.addEventListener('resize',()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitMonth,120); });

  // ---------- Render ----------
  function render(){
    renderMeals();
    $('vWeek').classList.toggle('on',mode==='week');
    $('vMonth').classList.toggle('on',mode==='month');
    if(!Object.keys(schoolDays()).length){
      hero.style.display='none';
      lbl.textContent='';
      viewEl.innerHTML='';
      viewEl.appendChild(emptyState());
      noteEl.textContent='';
      return;
    }
    renderHero();
    if(mode==='week'){ mainEl.classList.remove('fit','nofit'); renderWeek(); }
    else renderMonth();
  }

  function emptyState(){
    const d=document.createElement('div');d.className='empty-state';
    // A copy that still has the placeholder link was pasted before the
    // updater filled it in. Say so plainly -- only the site owner will ever
    // see this, and it's the one message that tells them how to fix it.
    const unlinked = !/^https?:/i.test(MENU_URL);
    const b=document.createElement('b');
    b.textContent = unlinked ? 'This copy of the menu isn\u2019t set up yet' : 'Menu unavailable';
    d.appendChild(b);
    d.appendChild(document.createTextNode(unlinked
      ? 'This is the template file. In the GitHub repository, open embed.html (the updater creates it on every run) and paste that into Google Sites instead.'
      : "Couldn't load the menu right now. It refreshes automatically each day."));
    const r=document.createElement('button');r.className='retry';r.textContent='Try again';
    r.addEventListener('click',load);d.appendChild(document.createElement('br'));d.appendChild(r);
    return d;
  }

  // ---------- Controls ----------
  $('vWeek').addEventListener('click',()=>{
    if(mode!=='week'){
      mode='week';
      const now=new Date();
      if(anchor.getFullYear()===now.getFullYear()&&anchor.getMonth()===now.getMonth()){
        anchor=schoolWeekMonday(now);
      }else{
        let d=new Date(anchor);                       // 1st of the shown month
        while(d.getDay()===0||d.getDay()===6) d=addDays(d,1);
        anchor=mondayOf(d);
      }
    }
    render();
  });
  $('vMonth').addEventListener('click',()=>{
    if(mode!=='month'){
      mode='month';
      // A week straddling two months belongs to the month its Wednesday is in.
      const mid=addDays(anchor,2);
      anchor=new Date(mid.getFullYear(),mid.getMonth(),1);
    }
    render();
  });
  $('prev').addEventListener('click',()=>{
    anchor = mode==='week' ? addDays(anchor,-7) : new Date(anchor.getFullYear(),anchor.getMonth()-1,1);
    render();
  });
  $('next').addEventListener('click',()=>{
    anchor = mode==='week' ? addDays(anchor,7) : new Date(anchor.getFullYear(),anchor.getMonth()+1,1);
    render();
  });
  $('tdy').addEventListener('click',()=>{
    const w=schoolWeekMonday(new Date());
    anchor = mode==='week' ? w : new Date(w.getFullYear(),w.getMonth(),1);
    render();
  });

  // ---------- Load ----------
  function fmtWhen(iso){try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return null;}}

  function adopt(p){
    DATA=p;
    school=Object.keys(DATA.schools||{})[0]||null;
    const ms=allMeals(); if(!ms.includes(meal)) meal=ms[0]||null;
    anchor=schoolWeekMonday(new Date());
    // If the coming week has nothing posted, jump to the nearest week that does.
    const has=w=>{for(let i=0;i<5;i++) if(itemsFor(key(addDays(w,i))).length) return true; return false;};
    if(!has(anchor)){
      const ks=Object.keys(schoolDays()).filter(k=>itemsFor(k).length).sort();
      const nk=ks.find(k=>k>=TODAY)||ks[ks.length-1];
      if(nk) anchor=mondayOf(fromKey(nk));
    }
    render();
  }

  async function load(){
    statusEl.textContent='Loading…';
    try{
      const res=await fetch(MENU_URL,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(!data||!data.schools||!Object.keys(data.schools).length) throw new Error('no menu data');
      const w=fmtWhen(data.generated_at);
      statusEl.textContent=w?`Updated ${w}`:'Live menu';
      adopt(data);
    }catch(err){
      console.warn('Live menu unavailable, using saved copy:',err);
      const n=FALLBACK.schools&&Object.keys(FALLBACK.schools).length;
      statusEl.textContent=n?'Saved menu':'Menu unavailable';
      statusEl.title='Could not load live menu ('+((err&&err.message)||err)+').';
      adopt(FALLBACK);
    }
  }
  load();

  // ---------- Ambient background motion (same as the countdown page) ----------
  (function(){
    const cv=document.getElementById('fx'); if(!cv||!cv.getContext) return;
    const ctx=cv.getContext('2d');
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W=0,H=0,parts=[],raf=null;
    const rand=(a,b)=>a+Math.random()*(b-a);
    function seed(){
      const DPR=Math.min(2,window.devicePixelRatio||1);
      W=cv.clientWidth; H=cv.clientHeight;
      cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
      const n=reduce?0:Math.min(9,Math.round(W*H/140000));
      const pal=['rgba(255,255,255,.34)','rgba(255,120,130,.3)'];
      parts=Array.from({length:n},()=>({x:rand(0,W),y:rand(0,H),r:rand(.8,1.9),
        vx:rand(-.12,.12),vy:rand(-.34,-.08),ph:rand(0,6.28),
        c:pal[Math.floor(Math.random()*pal.length)]}));
      if(!raf&&parts.length) raf=requestAnimationFrame(frame);
    }
    function frame(t){
      raf=null; ctx.clearRect(0,0,W,H);
      parts.forEach(p=>{
        p.x+=p.vx+Math.sin(t/2600+p.ph)*.2; p.y+=p.vy;
        if(p.y<-6){p.y=H+6;p.x=rand(0,W);} if(p.x<-6)p.x=W+6; if(p.x>W+6)p.x=-6;
        ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
      });
      if(parts.length&&!document.hidden) raf=requestAnimationFrame(frame);
    }
    let rz=null;
    window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(seed,160);});
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!raf&&parts.length) raf=requestAnimationFrame(frame); });
    seed();
  })();

  // Pause ambient motion briefly while views change, so the change itself
  // stays smooth on low-powered devices.
  (function(){
    let t=null;
    const pause=()=>{document.body.classList.add('switching');clearTimeout(t);
      t=setTimeout(()=>document.body.classList.remove('switching'),600);};
    document.addEventListener('click',e=>{ if(e.target.closest('button,.cell,.card,.chip')) pause(); },true);
  })();
});
